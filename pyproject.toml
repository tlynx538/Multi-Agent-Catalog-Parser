[project]
name = "multi-agent-catalog-parser"
version = "0.1.0"
description = "Converts raw catalog and quotation documents to structured product and vendor schemas"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "json-repair>=0.63.2",
    "jupyter>=1.1.1",
    "langchain>=1.3.15",
    "langchain-openai>=1.5.1",
    "langchain-openrouter>=0.2.7",
    "langgraph>=1.2.11",
    "opendataloader-pdf>=2.5.0",
    "openrouter>=0.11.46",
    "pymupdf4llm>=1.28.2",
    "python-dotenv>=1.2.2",
    "qdrant-client[fastembed]>=1.19.0",
]
